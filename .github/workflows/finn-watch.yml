name: FINN Angebots-Watcher

on:
  # Wird von AUSSEN ueber cron-job.org per 'workflow_dispatch' (GitHub-API)
  # ausgeloest - siehe README. Der interne GitHub-Schedule bleibt deaktiviert.
  workflow_dispatch: {}

permissions:
  contents: write   # noetig, damit der Workflow Stand, Verlauf und Dashboard committen kann

concurrency:
  group: finn-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # komplette Git-Historie, damit history.py den Verlauf rekonstruieren kann

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Watcher ausfuehren
        env:
          FINN_URL: ${{ vars.FINN_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python finn_watcher.py

      - name: Verlauf und Dashboard aktualisieren
        run: python history.py

      - name: Stand, Verlauf und Dashboard committen
        run: |
          git config user.name "finn-watcher-bot"
          git config user.email "actions@github.com"
          git add state.json history.json docs/
          if ! git diff --cached --quiet; then
            # bewusst OHNE [skip ci], sonst baut GitHub Pages die Seite nicht neu
            git commit -m "Update Stand und Verlauf"
            git push
          else
            echo "Keine Aenderung."
          fi
