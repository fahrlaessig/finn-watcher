name: FINN Angebots-Watcher

on:
  # HINWEIS: Der interne GitHub-'schedule'-Trigger wurde deaktiviert, da er
  # bei diesem Repo trotz korrekter Konfiguration nicht zuverlaessig feuerte
  # (bekannte GitHub-Plattform-Eigenheit). Stattdessen wird dieser Workflow
  # jetzt von AUSSEN ueber einen externen Cron-Dienst (cron-job.org) per
  # 'workflow_dispatch' (GitHub-API) ausgeloest - siehe README.
  #
  # Frueherer interner Trigger (aktuell auskommentiert):
  # schedule:
  #   - cron: "7 7-19 * * *"
  workflow_dispatch: {}   # wird vom externen Cron-Dienst UND manuell genutzt

permissions:
  contents: write   # noetig, damit der Workflow state.json zurueck committen kann

concurrency:
  group: finn-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Watcher ausfuehren
        env:
          FINN_URL: ${{ vars.FINN_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python finn_watcher.py

      - name: Aktualisierten Stand committen
        run: |
          git config user.name "finn-watcher-bot"
          git config user.email "actions@github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update state.json [skip ci]"
            git push
          else
            echo "Keine Aenderung am Stand."
          fi
